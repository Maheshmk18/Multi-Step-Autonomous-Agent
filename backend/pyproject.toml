[project]
name = "multi-agent-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "google-api-python-client>=2.150",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "groq>=0.31",
  "langgraph>=1.0",
  "langgraph-checkpoint-mongodb>=0.5",
  "langsmith>=0.4",
  "mcp>=1.18,<2",
  "pydantic-settings>=2.7",
  "pymongo>=4.10",
  "tavily-python>=0.7",
  "uvicorn[standard]>=0.34",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
